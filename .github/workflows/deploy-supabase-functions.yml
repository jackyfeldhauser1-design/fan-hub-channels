name: Deploy Supabase Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: biqvodzbbgfkzwrapftz
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credential
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate Supabase deployment credential
        run: |
          if ! supabase projects list >/dev/null 2>&1; then
            echo "::error::SUPABASE_ACCESS_TOKEN is invalid or expired. Replace the GitHub Actions secret with a fresh Supabase Personal Access Token; no Edge Function was deployed."
            exit 1
          fi
      - name: Deploy production Edge Functions
        run: |
          for function_name in telegram-webhook telegram-health cart-recovery growth-automation promo-assistant; do
            echo "Deploying ${function_name} to production project ${PROJECT_ID}"
            supabase functions deploy "${function_name}" --project-ref "$PROJECT_ID" --use-api
          done
